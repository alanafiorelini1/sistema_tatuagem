<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Senioridade — Tattoo Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/gerenciamento.css">
</head>

<body>
  <nav class="navbar navbar-dark menu fixed-top">
    <div class="container">
      <span class="navbar-brand fw-bold">Tattoo Studio</span>
      <div class="d-flex align-items-center flex-wrap justify-content-end gap-3">
        <a href="clientes.html" class="nav-link">Clientes</a>
        <a href="senioridade.html" class="nav-link active">Senioridade</a>
        <a href="estilos.html" class="nav-link">Estilos</a>
        <a href="tatuadores.html" class="nav-link">Tatuadores</a>
        <a href="agendamentos.html" class="nav-link">Agendamentos</a>
        <button type="button" onclick="sair()" class="btn-sair">
          <i class="fas fa-sign-out-alt me-1"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <main class="container conteudo-pagina">
    <a href="dashboard.html" class="voltar-dashboard">
      <i class="fas fa-arrow-left"></i> Voltar ao dashboard
    </a>
    <p class="subtitulo-secao mb-1">· GERENCIAMENTO ·</p>
    <h1 class="mb-4">SENIORIDADE</h1>

  <div id="aviso-somente-leitura" class="aviso-somente-leitura mb-4 d-none">
    Modo de consulta: somente administradores podem cadastrar, editar ou excluir senioridades.
  </div>
  <!-- Formulário para cadastrar nova senioridade -->
  <form id="form-senioridade" class="row g-2 mt-2 mb-5">
    <div class="col-md-4">
      <input type="text" id="nome" class="form-control" placeholder="Nome (ex: Júnior)" required>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-senioridade" type="submit" class="botao-estilizado w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde as senioridades vão aparecer -->
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
      </tbody>
    </table>
  </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/senioridade.js"></script>

</body>

</html>
