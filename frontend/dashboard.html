<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Dashboard — Tattoo Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <nav class="navbar navbar-dark menu fixed-top">
        <div class="container">
            <span class="navbar-brand fw-bold">Tattoo Studio</span>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm px-3">
                    <i class="fas fa-home me-1"></i> Início
                </a>
                <button onclick="sair()" class="btn btn-outline-danger btn-sm px-3">
                    <i class="fas fa-sign-out-alt me-1"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <div class="container conteudo-painel">
        <p class="subtitulo-secao mb-1 text-center">· GESTÃO DO ESTÚDIO ·</p>
        <h1 class="titulo-painel text-center mb-5">PAINEL DE CONTROLE</h1>

        <div class="row g-4 justify-content-center">
            <!-- Clientes -->
            <div class="col-12 col-md-4">
                <a href="clientes.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <span class="titulo-card">CLIENTES</span>
                </a>
            </div>

            <!-- Tatuadores -->
            <div class="col-12 col-md-4">
                <a href="tatuadores.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                    </div>
                    <span class="titulo-card">TATUADORES</span>
                </a>
            </div>

            <!-- Agendamentos -->
            <div class="col-12 col-md-4">
                <a href="agendamentos.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <span class="titulo-card">AGENDAMENTOS</span>
                </a>
            </div>

            <!-- Senioridade -->
            <div class="col-12 col-md-4">
                <a href="senioridade.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </div>
                    <span class="titulo-card">SENIORIDADE</span>
                </a>
            </div>

            <!-- Estilos -->
            <div class="col-12 col-md-4">
                <a href="estilos.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                        </svg>
                    </div>
                    <span class="titulo-card">ESTILOS</span>
                </a>
            </div>

            <!-- Novo Funcionário -->
            <div class="col-12 col-md-4">
                <a href="cadastro.html" class="card-painel">
                    <div class="icone-card">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                    </div>
                    <span class="titulo-card">NOVO FUNCIONÁRIO</span>
                </a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        protegerPagina()
    </script>

</body>

</html>
