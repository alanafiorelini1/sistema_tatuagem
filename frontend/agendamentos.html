<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Agendamentos — Tattoo Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/gerenciamento.css">
    <link rel="stylesheet" href="css/agendamentos.css">
</head>

<body>

    <nav class="navbar navbar-dark menu fixed-top">
        <div class="container">
            <span class="navbar-brand fw-bold">Tattoo Studio</span>
            <div class="d-flex align-items-center flex-wrap justify-content-end gap-3">
                <a href="clientes.html" class="nav-link">Clientes</a>
                <a href="senioridade.html" class="nav-link">Senioridade</a>
                <a href="estilos.html" class="nav-link">Estilos</a>
                <a href="tatuadores.html" class="nav-link">Tatuadores</a>
                <a href="agendamentos.html" class="nav-link active">Agendamentos</a>
                <button type="button" onclick="sair()" class="btn-sair">
                    <i class="fas fa-sign-out-alt me-1"></i> Sair
                </button>
            </div>
        </div>
    </nav>

    <main class="container conteudo-pagina">
        <a href="dashboard.html" class="voltar-dashboard">
            <i class="fas fa-arrow-left"></i> Voltar ao dashboard
        </a>
        <p class="subtitulo-secao mb-1">· GERENCIAMENTO ·</p>
        <h1 class="mb-4">AGENDAMENTOS</h1>

    <form id="form-agendamento" class="row g-2 mt-2 mb-5">
        <div class="col-md-3">
            <select id="idcliente" class="form-select" required>
                <option value="">Cliente...</option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="idtatuador" class="form-select" required>
                <option value="">Tatuador...</option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="date" id="dataagendamento" class="form-control" required>
        </div>
        <div class="col-md-2">
            <input type="time" id="horaagendamento" class="form-control" required>
        </div>
        <div class="col-md-2">
            <input type="number" id="valortatuagem" class="form-control" placeholder="Valor (R$)" step="0.01" min="0">
        </div>
        <div class="col-md-12">
            <textarea id="descricaotatuagem" class="form-control" placeholder="Descrição da tatuagem"></textarea>
        </div>
        <div class="col-md-4">
            <label class="form-label">Desenho aprovado (imagem)</label>
            <input type="file" id="desenho" class="form-control" accept="image/*">
        </div>

        <!-- Esse bloco começa escondido — só aparece quando estamos editando um agendamento existente -->
        <div class="col-md-3" id="bloco-status">
            <select id="status" class="form-select">
                <option value="pendente">Pendente</option>
                <option value="confirmado">Confirmado</option>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </div>

        <div class="col-md-2">
            <button id="btn-submit-agendamento" type="submit" class="botao-estilizado w-100">Cadastrar</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Tatuador</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Desenho</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
            </tbody>
        </table>
    </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/agendamentos.js"></script>

</body>

</html>
