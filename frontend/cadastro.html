<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Tattoo Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="auth-card p-4 p-md-5 text-center position-relative">
    <a href="dashboard.html" class="btn-voltar" title="Voltar ao dashboard">
      <i class="fas fa-arrow-left me-2"></i>Voltar ao dashboard
    </a>

    <p class="subtitulo-auth mb-1">· JUNTE-SE A NÓS ·</p>
    <h1 class="titulo-auth mb-4">CRIAR CONTA</h1>

    <form id="form-cadastro" class="text-start">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="mb-4">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn botao-estilizado w-100 m-0">CADASTRAR</button>
    </form>

    <p class="mt-4 texto-rodape mb-0">
      Já tem conta? <a href="login.html" class="link-auth">Entrar</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
