<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Clientes — Tattoo Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/gerenciamento.css">
</head>

<body>

  <nav class="navbar navbar-dark menu fixed-top">
    <div class="container">
      <span class="navbar-brand fw-bold">Tattoo Studio</span>
      <div>
        <a href="clientes.html" class="nav-link d-inline-block me-3 text-white">Clientes</a>
        <a href="senioridade.html" class="nav-link d-inline-block me-3">Senioridade</a>
        <a href="estilos.html" class="nav-link d-inline-block me-3">Estilos</a>
        <a href="tatuadores.html" class="nav-link d-inline-block me-3">Tatuadores</a>
        <a href="agendamentos.html" class="nav-link d-inline-block me-3">Agendamentos</a>
        <button type="button" onclick="sair()" class="btn-sair ms-2">
          <i class="fas fa-sign-out-alt me-1"></i> Sair
        </button>
      </div>
    </div>
  </nav>

  <div class="container conteudo-pagina">
    <a href="dashboard.html" class="voltar-dashboard">
      <i class="fas fa-arrow-left"></i> Voltar ao dashboard
    </a>
    <p class="subtitulo-secao mb-1">· GERENCIAMENTO ·</p>
    <h1 class="mb-4">CLIENTES</h1>

    <form id="form-cliente" class="row g-2 mt-2 mb-5">
      <div class="col-md-3">
        <input type="text" id="nome" class="form-control" placeholder="Nome" required>
      </div>
      <div class="col-md-2">
        <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
      </div>
      <div class="col-md-2">
        <input type="text" id="telefone" class="form-control" placeholder="Telefone">
      </div>
      <div class="col-md-2">
        <input type="text" id="cidade" class="form-control" placeholder="Cidade">
      </div>
      <div class="col-md-1">
        <input type="text" id="uf" class="form-control" placeholder="UF" maxlength="2">
      </div>
      <div class="col-md-2">
        <button id="btn-submit-cliente" type="submit" class="botao-estilizado w-100 m-0">CADASTRAR</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>Cidade</th>
            <th>UF</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>

</body>

</html>
